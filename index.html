<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Don Demon Hot-Dogs</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Cinzel+Decorative:wght@700;900&family=Oswald:wght@400;600&display=swap" rel="stylesheet"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style/index.css"/>
</head>
<body>

  <!-- Ember particles -->
  <div class="embers" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- Flame line top -->
  <div class="flame-bar top-bar"></div>

  <main class="hero-section d-flex flex-column align-items-center justify-content-center min-vh-100 text-center px-3">

    <!-- Logo -->
    <div class="logo-wrapper mb-4">
      <div class="logo-glow-ring"></div>
      <img
        src="img/logotipo.png"
        alt="Don Demon Hot-Dogs Logo"
        class="logo-img"
      />
    </div>

    <!-- Brand name -->
    <h1 class="brand-title">
      <span class="title-don">Don</span>
      <span class="title-demon">Demon</span>
      <span class="title-hotdogs">Hot‑Dogs</span>
    </h1>

    <!-- Divider -->
    <div class="divider-fire my-3" aria-hidden="true">
      <span>🔥</span><span class="line"></span><span>🔥</span>
    </div>

    <!-- Slogan -->
    <p class="slogan">Sabor explosivo en cada mordida</p>

    <!-- Buttons -->
    <div class="btn-group-custom d-flex flex-wrap justify-content-center gap-3 mt-4">
      <a href="menu.html" class="btn-demon btn-menu">
        <i class="bi bi-journal-text btn-icon"></i> Menú
      </a>
      <a href="redes.html" class="btn-demon btn-social">
        <i class="bi bi-share-fill btn-icon"></i> Redes Sociales
      </a>
    </div>

  </main>

  <!-- Flame line bottom -->
  <div class="flame-bar bottom-bar"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
